# shared pytest jobs to be used by other workflows
name: pytest

on:
  workflow_call

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: install python dependencies
        run: python -m pip install -r requirements.txt
      - name: run pytest
        run: pytest